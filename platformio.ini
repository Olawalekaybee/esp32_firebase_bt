; ============================================================
;  PlatformIO Project Configuration
;  ESP32 — Firebase + Bluetooth Classic + FreeRTOS
; ============================================================
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor
monitor_speed = 115200

; Partition scheme
board_build.partitions = default.csv

; Library dependencies
; FirebaseClient is the NEW mobizt library (replaces the old one)
lib_deps =
    mobizt/FirebaseClient @ ^1.5.9
    bblanchon/ArduinoJson @ ^7.0.4

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_CLASSIC_ENABLED=1
    -DCONFIG_BT_SPP_ENABLED=1
    ; Stack sizes (bytes)
    -DTASK_STACK_FIREBASE=8192
    -DTASK_STACK_BLUETOOTH=6144
    -DTASK_STACK_SENSOR=4096
    ; Task priorities (0=lowest, 24=highest on ESP32)
    -DTASK_PRIO_FIREBASE=2
    -DTASK_PRIO_BLUETOOTH=3
    -DTASK_PRIO_SENSOR=1
